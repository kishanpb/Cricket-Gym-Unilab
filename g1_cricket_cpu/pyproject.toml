[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "g1-cricket-cpu"
version = "0.1.2"
description = "CPU G1 cricket tasks with explicit external controller and scene assets"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "gymnasium==1.2.3",
  "hydra-core==1.3.2",
  "imageio==2.37.3",
  "mujoco==3.11.0",
  "numpy==2.4.4",
  "numba==0.67.0",
  "omegaconf==2.3.0",
  "onnxruntime==1.24.4",
  "prettytable==3.18.0",
  "psutil==7.2.2",
  "PyYAML==6.0.3",
  "rsl-rl-lib==5.0.1",
  "scipy==1.18.1",
  "skrl==2.1.0",
  "tensorboard==2.21.0",
  "tensordict==0.11.0",
  "torch==2.8.0",
  "tqdm==4.67.3",
  "unisim-core==1.2.0",
  "unilab-rl==1.2.0",
  "unilab==1.2.0"
]

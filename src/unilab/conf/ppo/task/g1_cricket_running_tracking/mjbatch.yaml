# @package _global_
defaults:
  - /task/g1_cricket_bimanual_tracking/mujoco
  - _self_

training:
  task_name: G1CricketDeliveryPitchV2
algo:
  num_envs: 8
  max_iterations: 128
  save_interval: 128
  policy:
    init_noise_std: 0.2
env:
  mujoco_substep_engine: mjbatch
  mujoco_observe_substeps: true
  sim_dt: 0.0000625
  max_episode_seconds: 2.7
  scene:
    entities:
      ball:
        root_body_name: cricket_ball
        body_names: [cricket_ball]
  actions:
    reference:
      _target_: unilab.tasks.manipulation.g1_cricket.running_task.RunningReferenceActionCfg
      reference_file: g1_cricket_results/running_front_raise_v1/${env.handedness}_reference.npz
      scale: 0.25
  commands:
    motion:
      _target_: unilab.tasks.manipulation.g1_cricket.running_task.RunningMotionCommandCfg
      params:
        motion_file: g1_cricket_results/running_front_raise_v1/${env.handedness}_tracking.npz
  observations:
    actor:
      terms:
        contact:
          func: unilab.tasks.manipulation.g1_cricket.running_task.running_contact_observation
    critic:
      terms:
        contact:
          func: unilab.tasks.manipulation.g1_cricket.running_task.running_contact_observation
  terminations:
    fallen:
      func: unilab.tasks.manipulation.g1_cricket.task.fallen

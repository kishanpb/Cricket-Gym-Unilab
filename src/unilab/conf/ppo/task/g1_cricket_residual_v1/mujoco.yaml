# @package _global_
defaults:
  - /task/g1_cricket_prior_v2/mujoco
  - _self_

algo:
  num_envs: 4
  num_steps_per_env: 24
  max_iterations: 2080
  save_interval: 2080
  policy:
    actor_hidden_dims: [64, 64]
    critic_hidden_dims: [64, 64]
    init_noise_std: 0.2
  algorithm:
    num_mini_batches: 2
    learning_rate: 0.0001
    entropy_coef: 0.0
    target_kl_stop: 0.02
    disable_finite_checks: false
env:
  handedness: right
  max_episode_seconds: 2.0
  auto_reset: true
  adaptive_chunk_size: false
  scene:
    entities:
      robot:
        body_names: [pelvis, cricket_bat]
  observations:
    policy:
      terms:
        last_action:
          func: unilab.tasks.manipulation.g1_cricket.residual.last_baseline_action
    cricket:
      history_length: 0
      terms:
        state:
          func: unilab.tasks.manipulation.g1_cricket.residual.CricketObservation
  policy_observation_group: cricket
  actions:
    joint_pos: null
    residual:
      _target_: unilab.tasks.manipulation.g1_cricket.residual.FrozenPriorResidualCfg
      entity_name: robot
      asset_directory: ~/Library/Caches/unitree_rl_lab/4960b84732b0c2ec593dccbfe963fda1bcd7b1e3
  events:
    reset_toss:
      func: unilab.tasks.manipulation.g1_cricket.residual.ResetToss
      mode: reset
      params:
        offsets: [-0.12, -0.10, 0.0]
        enabled: true
reward:
  batting:
    func: unilab.tasks.manipulation.g1_cricket.residual.BattingReward
    weight: 1.0
  failure:
    func: unilab.tasks.manipulation.g1_cricket.residual.failure_penalty
    weight: -5.0
  action_rate:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.01
